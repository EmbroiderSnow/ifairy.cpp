name: Build and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64-avx2
            runner: ubuntu-22.04
          - platform: macos-arm64
            runner: macos-15
          - platform: android-arm64
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select archive version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="$GITHUB_REF_NAME"
            [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          else
            version="snapshot-${GITHUB_SHA:0:12}"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Install pinned Android NDK
        if: matrix.platform == 'android-arm64'
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;30.0.16248370'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
      - name: Check model isolation
        run: python3 scripts/check-ifairy-only.py
      - name: Build, test and package
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          python3 scripts/build-release.py \
            --platform "$RELEASE_PLATFORM" --version "$RELEASE_VERSION" \
            --jobs 3 2>&1 | tee build-release.log
      - name: Save build and test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: logs-${{ matrix.platform }}
          path: |
            build-release.log
            build-release-*/Testing/Temporary/LastTest.log
          retention-days: 14
      - name: Save release archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-${{ matrix.platform }}
          path: out/release/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: package-*
          merge-multiple: true
          path: out/release
      - name: Verify all platforms and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          cd out/release
          for platform in macos-arm64 linux-x86_64-avx2 android-arm64; do
            test -s "ifairy-${GITHUB_REF_NAME}-${platform}.tar.gz"
          done
          test "$(find . -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 3
          sha256sum ./*.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS
          if gh release view "$GITHUB_REF_NAME" --json isDraft > release-state.json; then
            # A retry may finish a draft, but must never replace a published release.
            jq -e '.isDraft == true' release-state.json
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
              --title "iFairy.cpp $GITHUB_REF_NAME" \
              --notes-file ../../docs/release-notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" ./*.tar.gz SHA256SUMS --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
